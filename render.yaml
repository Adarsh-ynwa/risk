services:
  - type: web
    name: ai-risk-manager-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/seed_production.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-risk-manager-db
          property: connectionString
      - key: SEED_DEMO_DATA
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: ai-risk-manager-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: ai_risk_manager
    user: ai_risk_manager
    ipAllowList: []
